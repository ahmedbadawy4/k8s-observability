# Smoke test: sends synthetic traces and metrics to Grafana Alloy over OTLP.
#
# Run with `make smoke`. The Job sends 10 seconds of traces and metrics for the
# service "telemetrygen". It needs the stack from `make up`.
#
# After it completes:
#   - Grafana > Explore > Tempo: search for service.name = telemetrygen
#   - Grafana > Explore > Prometheus: query  gen
#
# telemetrygen is the OpenTelemetry Collector contrib load generator.
apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen
  namespace: monitoring
  labels:
    app.kubernetes.io/name: telemetrygen
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetrygen
    spec:
      restartPolicy: Never
      containers:
        - name: traces
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - traces
            - --otlp-endpoint=alloy.monitoring.svc.cluster.local:4317
            - --otlp-insecure
            - --service=telemetrygen
            - --duration=10s
            - --rate=20
            - --workers=1
        - name: metrics
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
          args:
            - metrics
            - --otlp-endpoint=alloy.monitoring.svc.cluster.local:4317
            - --otlp-insecure
            - --service=telemetrygen
            - --otlp-metric-name=gen
            - --duration=10s
            - --rate=5
            - --workers=1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
